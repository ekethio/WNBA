name: Fetch WNBA Stats
 
on:
  schedule:
    - cron: '0 7 * * *'
  push:
    paths:
      - 'fetch_wnba.py'
  workflow_dispatch:
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run WNBA fetch script
        run: python fetch_wnba.py
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnba_stats.json
          git diff --staged --quiet || git commit -m "Update WNBA stats $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
 
