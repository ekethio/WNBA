name: Fetch WNBA Stats

# Daily updates now run from the owner's PC (update_from_pc.ps1 via Windows
# Task Scheduler), because stats.wnba.com doesn't answer GitHub's servers.
# This workflow is kept for manual runs only.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install nba_api
      - name: Run WNBA fetch script
        run: python fetch_wnba.py
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnba_stats.json
          git diff --staged --quiet || git commit -m "Update WNBA stats $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
